<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIGAME Platformer Prototype</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="AIGAME platformer prototype">
      <section class="stage-wrap">
        <canvas id="game" width="960" height="540" aria-label="Playable platformer canvas"></canvas>
      </section>
      <section class="hud" aria-label="Controls">
        <div>
          <strong>Controls</strong>
          <span>Arrow keys or A/D to move, Space/W/Up to jump</span>
        </div>
        <div class="hud-readout">
          <span id="score">Sparks: 0</span>
          <span id="status" aria-live="polite">Ready</span>
        </div>
      </section>
    </main>
    <script type="module" src="src/game.js"></script>
  </body>
</html>
